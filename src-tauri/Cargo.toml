[package]
name = "neatshotx"
version = "0.1.0"
edition = "2021"

[lib]
name = "neatshotx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
device_query = "4.0.1"
image = "0.25.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-drag = "2.1.1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
xcap = "0.9.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 1

[profile.release]
strip = true
lto = true
codegen-units = 1
